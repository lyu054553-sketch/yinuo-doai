<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root {
  --bg: #F1F3F2;
  --surface: #FFFFFF;
  --surface-2: #F7F8F8;
  --ink: #1B1F24;
  --muted: #5D646C;
  --line: #D9DDDC;
  --accent: #24365E;
  --accent-soft: #E2E7F1;
  --ok: #2E7650; --ok-bg: #E1F0E7;
  --plain: #56606B; --plain-bg: #ECEEF0;
  --warn: #8F5B00; --warn-bg: #FAEED3;
  --bad: #B0261F; --bad-bg: #FBE2DF;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121417; --surface: #1A1D21; --surface-2: #20242A; --ink: #E7E9EB; --muted: #A1A8B0; --line: #2E333A;
    --accent: #9DB3E3; --accent-soft: #233150;
    --ok: #7FCB9F; --ok-bg: #1C3327; --plain: #AAB3BD; --plain-bg: #262B31;
    --warn: #F0BF62; --warn-bg: #3A2D12; --bad: #F2948C; --bad-bg: #3D1E1C;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 14px; line-height: 1.6;
  padding: 28px max(18px, env(safe-area-inset-right, 0px)) 48px max(18px, env(safe-area-inset-left, 0px));
}
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-size: 28px; line-height: 1.3; letter-spacing: .02em; }
h2 { font-family: var(--font-display); font-size: 17px; }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { width: min(1180px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); }
.lead { color: var(--muted); max-width: 66ch; margin-top: 6px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.note { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 6px; padding: 9px 12px; }
.layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 13px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.meta { color: var(--muted); font-size: 12px; }
.small { color: var(--muted); font-size: 12px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.file {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.tools:has(.file:focus-visible) .file-label { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools:has(.file:disabled) .file-label { opacity: .55; cursor: not-allowed; }
.preview { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.preview[hidden] { display: none; }
.preview img { width: 96px; height: 118px; object-fit: cover; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }
.preview b { display: block; overflow-wrap: anywhere; font-size: 13px; }
.status { border-radius: 6px; padding: 8px 10px; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
.status[hidden] { display: none; }
.status.loading { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.status.error { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
.status.success { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); }
.results[hidden] { display: none; }
.results { display: flex; flex-direction: column; gap: 8px; }
.group-title { font-size: 11.5px; color: var(--muted); letter-spacing: .04em; margin-top: 2px; }
.field { padding: 9px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field-head b { font-size: 13px; font-weight: 500; }
.value { margin-top: 2px; font-size: 14px; overflow-wrap: anywhere; }
.compare { margin-top: 4px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 7px; font-size: 12px; color: var(--muted); }
.cmp { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 7px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.cmp-ok { color: var(--ok); background: var(--ok-bg); }
.cmp-warn { color: var(--warn); background: var(--warn-bg); }
.cmp-bad { color: var(--bad); background: var(--bad-bg); }
.cmp-plain { color: var(--plain); background: var(--plain-bg); }
.badge { display: inline-flex; border-radius: 999px; padding: 0 7px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.badge-pending { color: var(--warn); background: var(--warn-bg); }
.badge-unknown { color: var(--plain); background: var(--plain-bg); }
.evidence { border-top: 1px solid var(--line); padding-top: 8px; }
.evidence summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.evidence-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.evidence-row { font-size: 12px; color: var(--muted); display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 6px; }
.evidence-row b { color: var(--ink); font-weight: 500; }
.plan { display: flex; flex-direction: column; }
.plan-row { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.plan-row:first-child { border-top: 0; }
.plan-row .k { font-family: var(--font-display); font-size: 13px; font-weight: 600; }
.plan-row .v { font-size: 13px; overflow-wrap: anywhere; }
.plan-ver { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
.result-actions { display: flex; justify-content: flex-end; }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 24px; }
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">衣诺 · 独立看图工具</div>
      <h1>参考图核对</h1>
      <p class="lead">选一张衣服图片，让电脑看看领子、长短、纽扣、颜色这些细节。结果只当参考，不会自动改案例方案。</p>
    </div>
    <div class="top-actions">
      <a class="btn" href="case2.html">返回案例二</a>
    </div>
  </header>

  <p class="note">看图、临时文件处理都在你的电脑上完成，图片不会上传。结果一律标“疑似”，最后要由人确认。</p>

  <main class="layout">
    <section class="panel" id="vision-panel">
      <div class="panel-head">
        <h2>选一张图</h2>
        <span class="meta">只在你的电脑上看图</span>
      </div>
      <p class="small">可以选挂拍图、上身图或参考截图。图片不超过 14MB。</p>
      <div class="tools">
        <label class="btn file-label" for="vision-file">选择图片</label>
        <input class="file" id="vision-file" type="file" accept="image/*" aria-label="选择一张参考图">
        <button class="btn primary" id="vision-run" type="button" disabled>开始看图</button>
      </div>
      <div class="preview" id="vision-preview" hidden>
        <img id="vision-preview-img" alt="已选择的参考图预览">
        <div>
          <b id="vision-filename"></b>
          <span class="small">图片只在这台电脑里处理，不会上传。</span>
        </div>
      </div>
      <p class="status" id="vision-status" role="status" aria-live="polite" hidden></p>
      <div class="results" id="vision-results" hidden></div>
      <div class="result-actions">
        <button class="btn" id="copy-result" type="button" hidden>复制核对结果</button>
      </div>
      <p class="small">通常等 30–90 秒，第一次会更久。电脑自己给出的把握不是标准答案，拿不准的地方还要人看。</p>
    </section>

    <aside class="col">
      <div class="panel">
        <div class="panel-head">
          <h2>正在对照的方案</h2>
          <span class="plan-ver" id="plan-version"></span>
        </div>
        <div class="plan" id="plan-rows"></div>
      </div>
      <p class="note">这里只做“图片和方案”的候选比对，不会修改方案，也不会增加版本号。需要改方案，请回到案例页人工确认。</p>
    </aside>
  </main>
</div>

<script>
(function () {
  "use strict";

  var PLAN_KEY = "yinuo:case2:plan-context";
  var FALLBACK_PLAN = {
    version: 1,
    fields: [
      { key: "品类", value: "外套" },
      { key: "版型结构", value: "H 型直身结构，微微收腰；肩型采用微落平肩，线条简约利落" },
      { key: "领型", value: "青果西装领，领型线条柔和舒展" },
      { key: "面料", value: "提花宋锦，垂感顺滑，自带柔和光泽，挺而不硬" },
      { key: "色彩", value: "客户未提（参考图为黑色）" },
      { key: "装饰纹样", value: "衣身植物暗花纹样，点缀细碎点状星光装饰" },
      { key: "长度比例", value: "衣长至臀中位置" },
      { key: "松弛余量", value: "整体围度宽松，活动自在，上身无束缚紧绷感" }
    ]
  };
  var VISION_FIELDS = [
    { key: "collar_family", label: "领型" },
    { key: "front_closure", label: "衣服怎么合上" },
    { key: "length", label: "衣服有多长" },
    { key: "buttons_visible", label: "能看到纽扣吗" },
    { key: "silhouette", label: "整体形状" },
    { key: "pattern", label: "花纹", group: "花纹和颜色" },
    { key: "colors", label: "颜色", group: "花纹和颜色" }
  ];
  var state = {
    plan: FALLBACK_PLAN,
    fileName: "",
    previewUrl: "",
    imageDataUrl: "",
    loading: false,
    error: "",
    fields: null,
    diagnostics: null
  };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    if (attrs) for (var key in attrs) {
      if (key === "class") node.className = attrs[key];
      else if (key === "text") node.textContent = attrs[key];
      else if (key.indexOf("on") === 0) node.addEventListener(key.slice(2), attrs[key]);
      else node.setAttribute(key, attrs[key]);
    }
    (children || []).forEach(function (child) {
      if (child != null) node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    });
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function copyText(text, button) {
    function done(ok) {
      var old = button.textContent;
      button.textContent = ok ? "已复制" : "请手动复制";
      setTimeout(function () { button.textContent = old; }, 1400);
    }
    try {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } catch (error) { done(false); }
  }

  function loadPlan() {
    try {
      var saved = JSON.parse(localStorage.getItem(PLAN_KEY));
      if (saved && Array.isArray(saved.fields) && saved.fields.length) return saved;
    } catch (error) {}
    return FALLBACK_PLAN;
  }

  function field(plan, key) {
    for (var i = 0; i < plan.fields.length; i++) if (plan.fields[i].key === key) return plan.fields[i];
    return null;
  }
  function planValue(plan, key) {
    var item = field(plan, key);
    return item ? item.value : "方案里没写";
  }

  function visionValueText(key, value) {
    if (Array.isArray(value)) return value.length ? value.join("、") : "看不出";
    if (key === "buttons_visible") {
      if (value === true) return "可见";
      if (value === false) return "未见";
    }
    if (value == null || value === "") return "看不出";
    return String(value);
  }
  function visionUnknown(value) {
    if (Array.isArray(value)) return !value.length || value.every(function (item) { return item === "看不出"; });
    return value == null || value === "" || value === "看不出";
  }
  function compareVision(key, value, plan) {
    if (visionUnknown(value)) {
      return { kind: "plain", label: "没认出来", note: "电脑没有给出答案，请人直接看图片。" };
    }
    var shown = visionValueText(key, value);
    if (key === "collar_family") {
      if (value === "翻领") return { kind: "ok", label: "可能一样", note: "方案写的是" + planValue(plan, "领型").split("，")[0] + "，电脑看出的也是翻领；领口多宽还要人来看。" };
      if (value === "立领") return { kind: "bad", label: "可能不一样", note: "方案写的是" + planValue(plan, "领型").split("，")[0] + "，电脑却觉得像立领。请人确认，页面不会自动改方案。" };
      return { kind: "warn", label: "要人看一下", note: "电脑觉得像“" + shown + "”，和方案里的领型是不是一回事，要设计师判断。" };
    }
    if (key === "front_closure") {
      return { kind: "plain", label: "方案里没写", note: "现在的方案没有这一项；电脑的结果只供参考，不会自动加进去。" };
    }
    if (key === "length") {
      if (value === "臀部附近") return { kind: "ok", label: "可能一样", note: "方案写的是“" + planValue(plan, "长度比例") + "”，和电脑看出的位置对得上；最后还要试穿确认。" };
      return { kind: "warn", label: "要人看一下", note: "方案写的是“" + planValue(plan, "长度比例") + "”，电脑却觉得是“" + shown + "”；请人再看一下。" };
    }
    if (key === "buttons_visible") {
      return { kind: "plain", label: "方案里没写", note: "方案没有单独写纽扣；电脑看到的是“" + shown + "”，只供参考。" };
    }
    if (key === "silhouette") {
      if (value === "H 型") {
        var structure = planValue(plan, "版型结构");
        return { kind: "ok", label: "可能一样", note: "方案是 " + structure.split("；")[0] + "，和电脑看出的整体形状对得上；宽松多少还要确认。" };
      }
      return { kind: "warn", label: "要人看一下", note: "方案写的是“" + planValue(plan, "版型结构") + "”，电脑却觉得像“" + shown + "”；请设计师判断。" };
    }
    if (key === "pattern") {
      return { kind: "plain", label: "只供参考", note: "方案写的是“" + planValue(plan, "装饰纹样") + "”；电脑看到的花纹只供参考，不代表客户确认过。" };
    }
    if (key === "colors") {
      var colorText = visionValueText(key, value);
      if (colorText.indexOf("黑色") >= 0 && planValue(plan, "色彩").indexOf("黑色") >= 0) {
        return { kind: "ok", label: "可能一样", note: "方案里备注了“参考图是黑色”，和电脑看出的颜色一样；客户还没确认颜色。" };
      }
      return { kind: "warn", label: "要人看一下", note: "客户还没选颜色；电脑觉得是“" + colorText + "”，交接时要再确认。" };
    }
    return { kind: "plain", label: "只供参考", note: "只当参考，不会自动改方案。" };
  }
  function evidenceText(evidence) {
    if (!evidence) return "没有多记理由。";
    var parts = [];
    if (evidence.probability != null) parts.push("电脑给自己的把握：" + (evidence.probability * 100).toFixed(1) + "%");
    if (evidence.margin != null) parts.push("比第二可能高 " + (evidence.margin * 100).toFixed(1) + " 个百分点");
    if (evidence.raw) parts.push("电脑原话：“" + String(evidence.raw).replace(/\s+/g, " ").trim() + "”");
    if (evidence.votes) parts.push("连看三次：" + evidence.votes.join(" / ") + "（一样 " + evidence.agreement + "/" + evidence.votes.length + " 次）");
    return parts.join("；") || "没有多记理由。";
  }
  function friendlySource(source) {
    if (!source) return "这台电脑上的免费看图工具";
    if (source.indexOf("FashionSigLIP") >= 0) return "免费看图工具（看整体）";
    if (source.indexOf("3B") >= 0) return "免费看图工具（看整体形状，连看 3 次）";
    if (source.indexOf("7B") >= 0) return "免费看图工具（看纽扣、花纹和颜色）";
    return source;
  }

  function renderPlan() {
    document.getElementById("plan-version").textContent = "v" + state.plan.version;
    var box = document.getElementById("plan-rows");
    clear(box);
    state.plan.fields.forEach(function (item) {
      box.appendChild(el("div", { class: "plan-row" }, [
        el("div", { class: "k", text: "【" + item.key + "】" }),
        el("div", { class: "v", text: item.value })
      ]));
    });
  }

  function renderResults() {
    var box = document.getElementById("vision-results");
    var copy = document.getElementById("copy-result");
    clear(box);
    if (!state.fields) {
      box.hidden = true;
      copy.hidden = true;
      return;
    }
    box.hidden = false;
    copy.hidden = false;
    var diagnostics = state.diagnostics && state.diagnostics.fields ? state.diagnostics.fields : {};
    var lastGroup = "structure";
    box.appendChild(el("div", { class: "group-title", text: "衣服结构（5 项）" }));
    VISION_FIELDS.forEach(function (meta) {
      var item = state.fields[meta.key];
      if (!item) return;
      if (meta.group && meta.group !== lastGroup) {
        lastGroup = meta.group;
        box.appendChild(el("div", { class: "group-title", text: meta.group }));
      }
      var shown = visionValueText(meta.key, item.value);
      var unknown = item.confidence === "看不出" || visionUnknown(item.value);
      var comparison = compareVision(meta.key, item.value, state.plan);
      var evidence = diagnostics[meta.key] || item;
      box.appendChild(el("div", { class: "field" }, [
        el("div", { class: "field-head" }, [
          el("b", { text: meta.label }),
          el("span", { class: "badge " + (unknown ? "badge-unknown" : "badge-pending"), text: unknown ? "看不出" : "疑似" })
        ]),
        el("div", { class: "value", text: shown }),
        el("div", { class: "compare" }, [
          el("span", { class: "cmp cmp-" + comparison.kind, text: comparison.label }),
          el("span", { text: comparison.note })
        ]),
        el("details", { class: "evidence" }, [
          el("summary", { text: "看看它为什么这么认" }),
          el("div", { class: "evidence-list" }, [
            el("div", { class: "evidence-row" }, [el("b", { text: "谁看的" }), el("span", { text: friendlySource(evidence.source || item.source) })]),
            el("div", { class: "evidence-row" }, [el("b", { text: "为什么" }), el("span", { text: evidenceText(evidence.evidence) })]),
            el("p", { class: "small", text: "这些百分比只是电脑自己的把握，不是标准答案；拿不准的地方还要人看。" })
          ])
        ])
      ]));
    });
  }

  function render() {
    var preview = document.getElementById("vision-preview");
    var img = document.getElementById("vision-preview-img");
    var status = document.getElementById("vision-status");
    var run = document.getElementById("vision-run");
    var fileInput = document.getElementById("vision-file");
    document.getElementById("vision-panel").setAttribute("aria-busy", state.loading ? "true" : "false");
    fileInput.disabled = state.loading;
    if (state.previewUrl) {
      preview.hidden = false;
      img.src = state.previewUrl;
      document.getElementById("vision-filename").textContent = state.fileName || "已选择的图片";
    } else {
      preview.hidden = true;
      img.removeAttribute("src");
      document.getElementById("vision-filename").textContent = "";
    }
    run.disabled = !state.imageDataUrl || state.loading;
    if (state.loading) {
      status.hidden = false;
      status.className = "status loading";
      status.textContent = "电脑正在看图，通常要等 30–90 秒。图片不会上传，看完后会删掉临时文件。";
    } else if (state.error) {
      status.hidden = false;
      status.className = "status error";
      status.textContent = state.error;
    } else if (state.fields) {
      status.hidden = false;
      status.className = "status success";
      status.textContent = "看完了。下面写的都只是“疑似”，拿来对照就好，不会自动改方案。";
    } else if (state.imageDataUrl) {
      status.hidden = false;
      status.className = "status";
      status.textContent = "图片选好了。点“开始看图”就行。";
    } else {
      status.hidden = true;
      status.className = "status";
      status.textContent = "";
    }
    renderResults();
  }

  function clearSelection() {
    state.fileName = "";
    state.previewUrl = "";
    state.imageDataUrl = "";
    state.loading = false;
    state.error = "";
    state.fields = null;
    state.diagnostics = null;
  }

  function chooseFile(file) {
    var input = document.getElementById("vision-file");
    if (!file) return;
    if (file.type && file.type.indexOf("image/") !== 0) {
      input.value = "";
      clearSelection();
      state.error = "请选择 JPG、PNG 等图片文件。";
      render();
      return;
    }
    if (file.size > 14 * 1024 * 1024) {
      input.value = "";
      clearSelection();
      state.error = "图片超过 14MB，请压缩后再试。";
      render();
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      state.fileName = file.name;
      state.previewUrl = String(reader.result);
      state.imageDataUrl = state.previewUrl;
      state.loading = false;
      state.error = "";
      state.fields = null;
      state.diagnostics = null;
      render();
    };
    reader.onerror = function () {
      input.value = "";
      clearSelection();
      state.error = "图片读取失败，请换一张再试。";
      render();
    };
    reader.readAsDataURL(file);
  }

  function runVision() {
    if (!state.imageDataUrl || state.loading) return;
    if (window.location.protocol === "file:") {
      state.error = "这个页面要配合本地看图服务打开，不能直接双击文件。";
      render();
      return;
    }
    state.loading = true;
    state.error = "";
    state.fields = null;
    state.diagnostics = null;
    render();
    fetch("/api/deconstruct", {
      method: "POST",
      cache: "no-store",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ imageDataUrl: state.imageDataUrl })
    }).then(function (response) {
      return response.text().then(function (text) {
        var data = null;
        try { data = JSON.parse(text); } catch (error) {}
        if (!response.ok) {
          console.error(data && data.error ? data.error : "HTTP " + response.status);
          throw new Error("电脑这次没看完，请再试一次。");
        }
        if (!data || !data.fields) throw new Error("电脑没有给出结果，请再试一次。");
        return data;
      });
    }).then(function (data) {
      state.loading = false;
      state.fields = data.fields;
      state.diagnostics = data.diagnostics || null;
      render();
    }).catch(function (error) {
      var message = error && error.message ? error.message : "电脑这次没看完，请再试一次。";
      if (/Failed to fetch|Load failed|NetworkError|fetch/i.test(message)) {
        message = "看图服务没连上。请先启动本地看图服务，再刷新页面（启动命令：python3 vision/server_local.py --port 8000）。";
      } else if (message.length > 500) {
        console.error(error);
        message = "电脑这次没看完，请查看启动服务的窗口。";
      }
      state.loading = false;
      state.error = message;
      state.fields = null;
      state.diagnostics = null;
      render();
    });
  }

  function resultText() {
    var lines = ["【参考图核对】方案 v" + state.plan.version];
    if (state.fileName) lines.push("参考图：" + state.fileName);
    VISION_FIELDS.forEach(function (meta) {
      var item = state.fields && state.fields[meta.key];
      if (!item) return;
      var unknown = item.confidence === "看不出" || visionUnknown(item.value);
      var comparison = compareVision(meta.key, item.value, state.plan);
      lines.push("- " + meta.label + "：" + visionValueText(meta.key, item.value) + "（" + (unknown ? "看不出" : "疑似") + "）｜" + comparison.label);
    });
    lines.push("说明：只是电脑候选，还没人工确认，也没有修改方案。");
    return lines.join("\n");
  }

  document.getElementById("vision-file").addEventListener("change", function (event) {
    chooseFile(event.target.files && event.target.files[0]);
  });
  document.getElementById("vision-run").addEventListener("click", runVision);
  document.getElementById("copy-result").addEventListener("click", function () {
    copyText(resultText(), this);
  });
  window.addEventListener("storage", function (event) {
    if (event.key !== PLAN_KEY) return;
    state.plan = loadPlan();
    renderPlan();
    renderResults();
  });

  state.plan = loadPlan();
  renderPlan();
  render();
})();
</script>
